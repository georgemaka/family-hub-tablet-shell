<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; frame-src https://script.google.com https://*.googleusercontent.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Family Hub</title>
  <!--
    Spike 1 — tablet shell (throwaway).
    Apps Script pages run in a Google frame that blocks the microphone. This
    top-level page owns the mic, embeds the Apps Script app, and hands recorded
    audio to it with postMessage. The app forwards it to its server with the
    user's own Google session. No secrets live here; the app URL is entered on
    the device and kept in localStorage.
  -->
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #eee;
                 font: 16px/1.4 system-ui, -apple-system, sans-serif; }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #111; }
    #mic { position: fixed; right: 20px; bottom: 20px; width: 72px; height: 72px; border-radius: 50%;
           border: 0; background: #2d5bd7; color: #fff; font-size: 30px; box-shadow: 0 4px 16px #0008; }
    #mic.recording { background: #c0392b; }
    #mic:disabled { background: #444; }
    #diagBtn { position: fixed; left: 12px; bottom: 20px; padding: 10px 14px; border-radius: 8px; border: 0;
               background: #333c; color: #ddd; font: inherit; }
    #diag { position: fixed; left: 12px; right: 12px; bottom: 80px; max-height: 60vh; overflow: auto;
            background: #1c1c1cf2; border-radius: 10px; padding: 12px; display: none; font-size: 14px; }
    #diag.open { display: block; }
    #diag table { width: 100%; border-collapse: collapse; }
    #diag td { padding: 4px 6px; border-top: 1px solid #2a2a2a; vertical-align: top; word-break: break-word; }
    #diag td:first-child { width: 40%; color: #bbb; }
    .PASS { color: #5fd27a; font-weight: 600; } .FAIL { color: #ff6b6b; font-weight: 600; }
    .WARN { color: #ffc14d; font-weight: 600; } .INFO { color: #8fb4ff; } .PENDING { color: #999; }
    #setup { max-width: 640px; margin: 10vh auto; padding: 20px; display: none; }
    #setup input { width: 100%; font: inherit; padding: 10px; border-radius: 6px; box-sizing: border-box; }
    #setup button, #diag button { font: inherit; padding: 10px 16px; margin-top: 10px; border-radius: 8px;
                                  border: 0; background: #2d5bd7; color: #fff; }
  </style>
</head>
<body>
  <div id="setup">
    <h1 style="font-size:20px">Family Hub — tablet setup</h1>
    <p>Paste the Apps Script web app URL (ends in <code>/exec</code>). It is stored on this device only.</p>
    <input id="urlInput" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
    <div id="urlError" class="FAIL"></div>
    <button id="saveUrl">Save and open</button>
  </div>

  <iframe id="app" title="Family Hub" hidden></iframe>
  <button id="mic" aria-label="Record a voice note" hidden>🎤</button>
  <button id="diagBtn" hidden>Shell checks</button>
  <div id="diag">
    <table id="diagTable"></table>
    <button id="copyDiag">Copy</button>
    <button id="resetUrl">Change app URL</button>
  </div>

<script>
(function () {
  'use strict';
  var STORE_KEY = 'familyhub_app_url';
  var APP_URL_RE = /^https:\/\/script\.google\.com\/macros\/(u\/\d+\/)?s\/[A-Za-z0-9_-]+\/(exec|dev)$/;
  var APP_ORIGIN_RE = /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/;
  var RECORD_MS = 4000;

  var checks = {};
  var appWindow = null, appOrigin = null;
  var pendingAck = null;

  function set(key, status, detail) {
    checks[key] = { status: status, detail: detail === undefined ? '' : String(detail) };
    var t = document.getElementById('diagTable');
    t.innerHTML = '';
    Object.keys(checks).forEach(function (k) {
      var tr = document.createElement('tr');
      var a = document.createElement('td'); a.textContent = k;
      var b = document.createElement('td');
      var s = document.createElement('span'); s.className = checks[k].status; s.textContent = checks[k].status;
      b.appendChild(s);
      if (checks[k].detail) b.appendChild(document.createTextNode(' — ' + checks[k].detail));
      tr.appendChild(a); tr.appendChild(b); t.appendChild(tr);
    });
  }
  function errText(e) { return e && e.name ? e.name + ': ' + e.message : String(e); }

  // ---------- setup ----------
  function savedUrl() {
    var fromQuery = new URLSearchParams(location.search).get('app');
    if (fromQuery && APP_URL_RE.test(fromQuery)) {
      localStorage.setItem(STORE_KEY, fromQuery);
      history.replaceState(null, '', location.pathname);   // keep the URL out of history/screens
    }
    var url = localStorage.getItem(STORE_KEY);
    return url && APP_URL_RE.test(url) ? url : null;
  }

  function showSetup() {
    document.getElementById('setup').style.display = 'block';
    document.getElementById('saveUrl').onclick = function () {
      var v = document.getElementById('urlInput').value.trim();
      if (!APP_URL_RE.test(v)) {
        document.getElementById('urlError').textContent = 'That is not an Apps Script web app URL ending in /exec.';
        return;
      }
      localStorage.setItem(STORE_KEY, v);
      location.reload();
    };
  }

  // ---------- app frame ----------
  function openApp(url) {
    var frame = document.getElementById('app');
    frame.hidden = false;
    document.getElementById('mic').hidden = false;
    document.getElementById('diagBtn').hidden = false;
    set('Shell origin', 'INFO', location.origin);
    set('Shell is top-level + secure', window.isSecureContext ? 'PASS' : 'FAIL', 'secure=' + window.isSecureContext);
    set('App connected (signed in inside the frame)', 'PENDING', 'waiting for the app to say hello…');
    frame.src = url;
    setTimeout(function () {
      if (!appWindow) set('App connected (signed in inside the frame)', 'FAIL',
        'no hello after 20 s — the frame may show a Google sign-in or "refused to connect" page (third-party cookies?)');
    }, 20000);
  }

  // Official apps the app may ask the shell to open (beside it). Nothing else can be launched.
  var APPS = { nanit: 'com.nanit.baby', alexa: 'com.amazon.dee.app', ring: 'com.ringapp' };
  var MAX_MESSAGE_CHARS = 3e6;

  window.addEventListener('message', function (e) {
    if (!APP_ORIGIN_RE.test(e.origin)) return;
    var msg = e.data || {};
    if (typeof msg !== 'object' || (typeof msg.b64 === 'string' && msg.b64.length > MAX_MESSAGE_CHARS)) return;
    if (msg.type === 'familyhub-open-app' || msg.type === 'familyhub-open-nanit') {
      var pkg = APPS[msg.type === 'familyhub-open-nanit' ? 'nanit' : msg.app];
      // Only the connected app may ask, and only for the official apps listed above.
      if (pkg && appWindow && e.source === appWindow) location.href = 'intent://#Intent;package=' + pkg + ';end';
      return;
    }
    if (msg.type === 'familyhub-hello') {
      appWindow = e.source; appOrigin = e.origin;
      set('App connected (signed in inside the frame)', 'PASS', e.origin);
      appWindow.postMessage({ type: 'familyhub-shell-hello', v: 1 }, appOrigin);
    } else if (msg.type === 'familyhub-audio-ack' && pendingAck) {
      pendingAck(msg);
    }
  });

  // ---------- microphone ----------
  function pickMime() {
    var opts = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm', 'audio/ogg;codecs=opus'];
    for (var i = 0; i < opts.length; i++) if (window.MediaRecorder && MediaRecorder.isTypeSupported(opts[i])) return opts[i];
    return '';
  }

  function blobToBase64(blob) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () { resolve(String(fr.result).split(',')[1] || ''); };
      fr.onerror = function () { reject(fr.error); };
      fr.readAsDataURL(blob);
    });
  }

  function record() {
    var btn = document.getElementById('mic');
    if (!appWindow) { set('Voice → app', 'FAIL', 'app not connected yet'); openDiag(); return; }
    btn.disabled = true;
    var stream;
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (s) {
      stream = s;
      set('Shell microphone permission', 'PASS', 'granted');
      var mime = pickMime();
      var rec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
      var chunks = [];
      rec.ondataavailable = function (ev) { if (ev.data && ev.data.size) chunks.push(ev.data); };
      var stopped = new Promise(function (r) { rec.onstop = r; });
      btn.disabled = false; btn.classList.add('recording'); btn.onclick = function () { rec.stop(); };
      rec.start(250);
      setTimeout(function () { if (rec.state !== 'inactive') rec.stop(); }, RECORD_MS);
      return stopped.then(function () {
        stream.getTracks().forEach(function (t) { t.stop(); });
        btn.classList.remove('recording'); btn.onclick = record; btn.disabled = true;
        var blob = new Blob(chunks, { type: rec.mimeType || mime || 'audio/webm' });
        set('Shell recorded clip', blob.size > 1000 ? 'PASS' : 'FAIL', blob.size + ' bytes, ' + blob.type);
        return blobToBase64(blob).then(function (b64) {
          var t = performance.now();
          return new Promise(function (resolve) {
            var timer = setTimeout(function () { pendingAck = null; resolve({ ok: false, error: 'no reply in 20 s' }); }, 20000);
            pendingAck = function (ack) { clearTimeout(timer); pendingAck = null; resolve(ack); };
            appWindow.postMessage({ type: 'familyhub-audio', b64: b64, mime: blob.type }, appOrigin);
          }).then(function (ack) {
            set('Voice → app → server', ack.ok ? 'PASS' : 'FAIL',
                ack.ok ? ack.bytes + ' bytes; server ' + ack.ms + ' ms; total ' + Math.round(performance.now() - t) + ' ms' : ack.error);
          });
        });
      });
    }).catch(function (e) {
      set('Shell microphone permission', 'FAIL', errText(e));
      openDiag();
    }).then(function () { btn.disabled = false; btn.classList.remove('recording'); btn.onclick = record; });
  }

  // ---------- diagnostics ----------
  function openDiag() { document.getElementById('diag').classList.add('open'); }
  document.getElementById('diagBtn').onclick = function () { document.getElementById('diag').classList.toggle('open'); };
  document.getElementById('copyDiag').onclick = function () {
    var report = { spike: 1, takenAt: new Date().toISOString(), userAgent: navigator.userAgent, checks: checks };
    navigator.clipboard.writeText(JSON.stringify(report, null, 1));
  };
  document.getElementById('resetUrl').onclick = function () { localStorage.removeItem(STORE_KEY); location.reload(); };
  document.getElementById('mic').onclick = record;

  var url = savedUrl();
  if (url) openApp(url); else showSetup();
})();
</script>
</body>
</html>
